openapi: 3.1.0
info:
  title: Prime Server Developer API
  version: "1"
  description: |
    Registration-first blob storage on Flare Coston2. The client prepares the
    bytes locally, the owner wallet registers the exact blob on the registry,
    and Prime RPC accepts the upload only after it verifies that registration.
servers:
  - url: https://your-prime-server.example
    description: Replace with the deployed Prime RPC origin
tags:
  - name: Service
  - name: Authentication
  - name: Blobs
  - name: Confidential compute
paths:
  /health:
    get:
      tags: [Service]
      summary: Check the Prime RPC process
      security: []
      responses:
        "200":
          description: Process is serving requests
          content:
            application/json:
              schema:
                type: object
                required: [status, providerCount]
                properties:
                  status:
                    type: string
                    example: ok
                  providerCount:
                    type: integer
                    example: 4
  /prime/v1:
    get:
      tags: [Service]
      summary: Discover API capabilities
      security: []
      responses:
        "200":
          description: Current API capabilities and proof boundary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /prime/v1/auth/challenge:
    get:
      tags: [Authentication]
      summary: Create a wallet login challenge
      security: []
      parameters:
        - $ref: "#/components/parameters/AddressQuery"
      responses:
        "200":
          description: Short-lived message to sign
          content:
            application/json:
              schema:
                type: object
                required: [address, nonce, message, issuedAt, expirationTime]
                properties:
                  address:
                    $ref: "#/components/schemas/Address"
                  nonce:
                    type: string
                  message:
                    type: string
                  issuedAt:
                    type: string
                    format: date-time
                  expirationTime:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
  /prime/v1/auth/session:
    post:
      tags: [Authentication]
      summary: Exchange a signed challenge for a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, nonce, signature]
              properties:
                address:
                  $ref: "#/components/schemas/Address"
                nonce:
                  type: string
                signature:
                  type: string
                  pattern: "^0x[0-9a-fA-F]+$"
      responses:
        "200":
          description: Bearer session
          content:
            application/json:
              schema:
                type: object
                required: [token, address, expiresAt]
                properties:
                  token:
                    type: string
                  address:
                    $ref: "#/components/schemas/Address"
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /prime/v1/account:
    get:
      tags: [Authentication]
      summary: Read the authenticated wallet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                type: object
                required: [address, expiresAt]
                properties:
                  address:
                    $ref: "#/components/schemas/Address"
                  expiresAt:
                    type: string
                    format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /prime/v1/blobs/{account}:
    get:
      tags: [Blobs]
      summary: List the authenticated wallet namespace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountPath"
        - in: query
          name: prefix
          schema:
            type: string
          description: Optional object-name prefix
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - in: query
          name: cursor
          schema:
            type: string
          description: Cursor returned by the previous page
      responses:
        "200":
          description: Owner-scoped object list
          content:
            application/json:
              schema:
                type: object
                required: [account, objects, nextCursor]
                properties:
                  account:
                    $ref: "#/components/schemas/Address"
                  objects:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlobObject"
                  nextCursor:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /prime/v1/blobs/{account}/{name}:
    parameters:
      - $ref: "#/components/parameters/AccountPath"
      - in: path
        name: name
        required: true
        schema:
          type: string
        description: |
          URL-encoded object name. Names may contain slash characters after the
          account segment and cannot end with a slash.
    put:
      tags: [Blobs]
      summary: Upload a previously registered blob
      description: |
        The wallet must first call createBlobNamed or createBlobNamedPaid on
        the configured registry. The request body must be the exact bytes used
        to calculate the registered commitment.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BlobIdHeader"
        - $ref: "#/components/parameters/CommitmentHeader"
        - $ref: "#/components/parameters/ChunkSizeHeader"
        - $ref: "#/components/parameters/DataShardsHeader"
        - $ref: "#/components/parameters/TotalShardsHeader"
        - $ref: "#/components/parameters/ExpiresAtHeader"
        - $ref: "#/components/parameters/StorageModeHeader"
        - $ref: "#/components/parameters/AccessPolicyHeader"
        - $ref: "#/components/parameters/PolicyCommitmentHeader"
        - $ref: "#/components/parameters/KeyEnvelopeCommitmentHeader"
        - $ref: "#/components/parameters/MetadataCommitmentHeader"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Blob stored and finalized
          headers:
            Location:
              schema:
                type: string
                format: uri
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlobObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
    get:
      tags: [Blobs]
      summary: Download a stored blob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccessRequestHeader"
        - $ref: "#/components/parameters/RangeHeader"
      responses:
        "200":
          description: Complete blob body
          headers:
            ETag:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
    head:
      tags: [Blobs]
      summary: Read blob metadata without downloading bytes
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccessRequestHeader"
      responses:
        "200":
          description: Metadata is returned in response headers
          headers:
            Content-Length:
              schema:
                type: integer
            ETag:
              schema:
                type: string
            X-Prime-Blob-Id:
              schema:
                type: string
            X-Prime-Expires-At:
              schema:
                type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /prime/v1/fcc/info:
    get:
      tags: [Confidential compute]
      summary: Read configured FCC proxy information
      security:
        - bearerAuth: []
      responses:
        "200":
          description: FCC proxy metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: FCC information is still pending
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: FCC proxy is not configured
  /prime/v1/fcc/result/{instructionId}:
    get:
      tags: [Confidential compute]
      summary: Poll a confidential compute result
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: instructionId
          required: true
          schema:
            $ref: "#/components/schemas/Bytes32"
      responses:
        "200":
          description: Signed FCC result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Result is pending
          content:
            application/json:
              schema:
                type: object
                required: [status, instructionId]
                properties:
                  status:
                    type: string
                    example: pending
                  instructionId:
                    $ref: "#/components/schemas/Bytes32"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: FCC proxy is not configured
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PrimeSession
  parameters:
    AddressQuery:
      in: query
      name: address
      required: true
      schema:
        $ref: "#/components/schemas/Address"
    AccountPath:
      in: path
      name: account
      required: true
      schema:
        $ref: "#/components/schemas/Address"
    BlobIdHeader:
      in: header
      name: x-prime-blob-id
      required: true
      schema:
        $ref: "#/components/schemas/Bytes32"
    CommitmentHeader:
      in: header
      name: x-prime-commitment
      required: true
      schema:
        $ref: "#/components/schemas/Bytes32"
    ChunkSizeHeader:
      in: header
      name: x-prime-chunk-size
      schema:
        type: integer
        example: 1048576
    DataShardsHeader:
      in: header
      name: x-prime-data-shards
      schema:
        type: integer
        example: 2
    TotalShardsHeader:
      in: header
      name: x-prime-total-shards
      schema:
        type: integer
        example: 4
    ExpiresAtHeader:
      in: header
      name: x-prime-expires-at
      schema:
        type: integer
        format: int64
    StorageModeHeader:
      in: header
      name: x-prime-storage-mode
      schema:
        type: string
        enum: [public, private, confidential, "0", "1", "2"]
    AccessPolicyHeader:
      in: header
      name: x-prime-access-policy
      schema:
        type: string
        enum: [owner_only, selected_wallets, compute_only, "0", "1", "2"]
    PolicyCommitmentHeader:
      in: header
      name: x-prime-policy-commitment
      schema:
        $ref: "#/components/schemas/Bytes32"
    KeyEnvelopeCommitmentHeader:
      in: header
      name: x-prime-key-envelope-commitment
      schema:
        $ref: "#/components/schemas/Bytes32"
    MetadataCommitmentHeader:
      in: header
      name: x-prime-metadata-commitment
      schema:
        $ref: "#/components/schemas/Bytes32"
    AccessRequestHeader:
      in: header
      name: x-prime-access-request-id
      schema:
        $ref: "#/components/schemas/Bytes32"
    RangeHeader:
      in: header
      name: Range
      schema:
        type: string
        example: bytes=0-1023
  schemas:
    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
      example: "0x1111111111111111111111111111111111111111"
    Bytes32:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"
    BlobObject:
      type: object
      required: [account, name, blobId, size, commitment, status, downloadUrl]
      properties:
        account:
          $ref: "#/components/schemas/Address"
        name:
          type: string
        blobId:
          $ref: "#/components/schemas/Bytes32"
        size:
          type: integer
          format: int64
        contentType:
          type: string
        commitment:
          $ref: "#/components/schemas/Bytes32"
        nameHash:
          $ref: "#/components/schemas/Bytes32"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: integer
          format: int64
        status:
          type: string
        origin:
          type: string
        storageMode:
          type: string
        accessPolicy:
          type: string
        policyCommitment:
          $ref: "#/components/schemas/Bytes32"
        keyEnvelopeCommitment:
          $ref: "#/components/schemas/Bytes32"
        metadataCommitment:
          $ref: "#/components/schemas/Bytes32"
        paymentStatus:
          type: string
        paymentAsset:
          type: string
        providerSettlements:
          type: array
          items:
            type: object
            additionalProperties: true
        downloadUrl:
          type: string
          format: uri
    Capabilities:
      type: object
      required: [service, apiVersion, network, authentication, capabilities]
      properties:
        service:
          type: string
          example: Prime Server
        apiVersion:
          type: string
          example: "1"
        network:
          type: string
          example: flare-coston2
        authentication:
          type: string
          example: wallet-signature-session
        maxBlobBytes:
          type: integer
          format: int64
        capabilities:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A valid Prime session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The session wallet is not authorized for this account or object
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Object or registration was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Registration or object state conflicts with the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The registration or object has expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RangeNotSatisfiable:
      description: The requested range cannot be served
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
